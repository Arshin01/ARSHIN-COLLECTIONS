<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>ARSHIN COLLECTIONS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#0d0d0d;
      color:white;
      overflow-x:hidden;
    }

    img{
      width:100%;
      display:block;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    button{
      border:none;
      cursor:pointer;
      font-family:'Inter',sans-serif;
    }

    nav{
      position:fixed;
      top:0;
      width:100%;
      z-index:999;
      padding:18px 6%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      backdrop-filter:blur(12px);
      background:rgba(0,0,0,0.45);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }

    .logo{
      font-size:28px;
      font-weight:700;
      letter-spacing:5px;
    }

    .cart-button{
      background:white;
      color:black;
      padding:10px 18px;
      border-radius:40px;
      font-size:14px;
      font-weight:600;
    }

    .hero{
      height:100vh;
      background:
      linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.7)),
      url('https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
    }

    .hero-content h1{
      font-size:72px;
      font-weight:700;
      margin-bottom:18px;
      letter-spacing:-2px;
    }

    .hero-content p{
      color:#d0d0d0;
      font-size:18px;
      margin-bottom:35px;
    }

    .hero-btn{
      background:white;
      color:black;
      padding:16px 30px;
      border-radius:50px;
      font-weight:600;
      display:inline-block;
      transition:0.3s;
    }

    .products{
      padding:100px 6%;
    }

    .section-title{
      font-size:42px;
      text-align:center;
      margin-bottom:60px;
      font-weight:700;
    }

    .product-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:28px;
    }

    .product-card{
      background:#171717;
      border-radius:26px;
      overflow:hidden;
      transition:0.4s ease;
      border:1px solid rgba(255,255,255,0.05);
    }

    .product-card:hover{
      transform:translateY(-6px);
    }

    .product-card img{
      height:380px;
      object-fit:cover;
    }

    .product-info{
      padding:22px;
    }

    .product-name{
      font-size:22px;
      font-weight:600;
      margin-bottom:10px;
    }

    .product-price{
      color:#d2d2d2;
      margin-bottom:18px;
      font-size:18px;
    }

    .size-select{
      width:100%;
      margin-bottom:18px;
      padding:14px;
      border-radius:12px;
      background:#222;
      color:white;
      border:1px solid rgba(255,255,255,0.1);
      font-size:15px;
      outline:none;
    }

    .add-cart{
      width:100%;
      background:white;
      color:black;
      padding:14px;
      border-radius:14px;
      font-weight:600;
      transition:0.3s;
    }

    .add-cart:hover{
      opacity:0.9;
    }

    .cart-panel{
      position:fixed;
      top:0;
      right:-100%;
      width:100%;
      max-width:420px;
      height:100vh;
      background:#111;
      z-index:1000;
      padding:25px;
      transition:0.4s ease;
      overflow-y:auto;
    }

    .cart-panel.active{
      right:0;
    }

    .cart-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .cart-top h2{
      font-size:28px;
    }

    .close-cart{
      font-size:26px;
      cursor:pointer;
    }

    .cart-item{
      display:flex;
      gap:15px;
      margin-bottom:22px;
      background:#1b1b1b;
      padding:12px;
      border-radius:18px;
    }

    .cart-item img{
      width:90px;
      height:110px;
      object-fit:cover;
      border-radius:12px;
    }

    .cart-item-details{
      flex:1;
    }

    .cart-item-name{
      font-weight:600;
      margin-bottom:8px;
    }

    .cart-item-price{
      color:#d3d3d3;
      margin-bottom:8px;
    }

    .cart-size{
      color:#bdbdbd;
      margin-bottom:10px;
      font-size:14px;
    }

    .remove-btn{
      background:#2a2a2a;
      color:white;
      padding:8px 12px;
      border-radius:10px;
      font-size:12px;
    }

    .checkout-btn{
      width:100%;
      background:#25D366;
      color:white;
      padding:16px;
      border-radius:16px;
      font-size:16px;
      font-weight:700;
      margin-top:20px;
    }

    .total{
      margin-top:20px;
      font-size:20px;
      font-weight:600;
    }

    footer{
      padding:40px 20px;
      text-align:center;
      color:#8e8e8e;
      border-top:1px solid rgba(255,255,255,0.05);
    }

    @media(max-width:768px){

      .hero-content h1{
        font-size:48px;
      }

      .hero-content p{
        font-size:15px;
      }

      .product-card img{
        height:320px;
      }

      .section-title{
        font-size:34px;
      }

      .cart-panel{
        max-width:100%;
      }

    }

  </style>
</head>

<body>

  <nav>

    <div class="logo">ARSHIN COLLECTIONS</div>

    <button class="cart-button" onclick="openCart()">
      Cart (<span id="cart-count">0</span>)
    </button>

  </nav>

  <section class="hero">

    <div class="hero-content">

      <h1>Modern Luxury</h1>

      <p>
        Made for Her Moment.
      </p>

      <a href="#shop" class="hero-btn">
        Explore Collection
      </a>

    </div>

  </section>

  <section class="products" id="shop">

    <h2 class="section-title">
      Featured Collection
    </h2>

    <div class="product-grid" id="product-grid"></div>

  </section>

  <div class="cart-panel" id="cart-panel">

    <div class="cart-top">

      <h2>Your Cart</h2>

      <div class="close-cart" onclick="closeCart()">
        ✕
      </div>

    </div>

    <div id="cart-items"></div>

    <div class="total">
      Total: ₹<span id="cart-total">0</span>
    </div>

    <button class="checkout-btn" onclick="checkoutWhatsApp()">
      Checkout On WhatsApp
    </button>

  </div>

  <footer>
    © 2026 ARSHIN. All rights reserved.
  </footer>

  <script>

    // PRODUCTS

    const products = [

      {
        image:"1.jpeg",
        name:"Black & White Cord Set",
        price:2799
      },

      {
        image:"2.jpeg",
        name:"Pink Long Kurta",
        price:3099
      },

      {
        image:"3.jpeg",
        name:"Dark Blue Cord Set",
        price:2799
      },

      {
        image:"4.jpeg",
        name:"Blue Printed Short Kurta",
        price:2499
      },

      {
        image:"5.jpeg",
        name:"Off-White Cord Set",
        price:2799
      },

      {
        image:"6.jpeg",
        name:"Light Pink Short Kurta",
        price:2499
      },

      {
        image:"7.jpeg",
        name:"Red Long Kurta",
        price:3099
      },

      {
        image:"8.jpeg",
        name:"Mint Green Short Kurta",
        price:2499
      },

      {
        image:"9.jpeg",
        name:"Brown Cord Set",
        price:2799
      },

      {
        image:"10.jpeg",
        name:"Blue & White Long Kurta",
        price:3099
      }

    ];

    // AUTO GENERATE PRODUCTS

    const productGrid = document.getElementById("product-grid");

    products.forEach((product,index)=>{

      productGrid.innerHTML += `

        <div class="product-card">

          <img src="${product.image}">

          <div class="product-info">

            <div class="product-name">
              ${product.name}
            </div>

            <div class="product-price">
              ₹${product.price}
            </div>

            <select class="size-select" id="size${index}">

              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>

            </select>

            <button class="add-cart"
              onclick="addToCart(
              '${product.name}',
              ${product.price},
              '${product.image}',
              document.getElementById('size${index}').value
              )">

              Add To Cart

            </button>

          </div>

        </div>

      `;

    });

    // CART

    let cart = [];

    function addToCart(name, price, image, size){

      cart.push({
        name,
        price,
        image,
        size
      });

      updateCart();

    }

    function updateCart(){

      const cartItems = document.getElementById("cart-items");
      const cartCount = document.getElementById("cart-count");
      const cartTotal = document.getElementById("cart-total");

      cartItems.innerHTML = "";

      let total = 0;

      cart.forEach((item,index)=>{

        total += item.price;

        cartItems.innerHTML += `

          <div class="cart-item">

            <img src="${item.image}">

            <div class="cart-item-details">

              <div class="cart-item-name">
                ${item.name}
              </div>

              <div class="cart-item-price">
                ₹${item.price}
              </div>

              <div class="cart-size">
                Size: ${item.size}
              </div>

              <button class="remove-btn"
                onclick="removeItem(${index})">
                Remove
              </button>

            </div>

          </div>

        `;

      });

      cartCount.innerText = cart.length;
      cartTotal.innerText = total;

    }

    function removeItem(index){

      cart.splice(index,1);

      updateCart();

    }

    function openCart(){

      document.getElementById("cart-panel")
      .classList.add("active");

    }

    function closeCart(){

      document.getElementById("cart-panel")
      .classList.remove("active");

    }

function checkoutWhatsApp(){

  if(cart.length === 0){

    alert("Your cart is empty.");
    return;

  }

  let message = `Hello, I want to order:\n\n`;

  let total = 0;

  cart.forEach((item,index)=>{

    message += `${index + 1}. ${item.name}\n`;
    message += `Size: ${item.size}\n`;
    message += `Price: ₹${item.price}\n\n`;

    total += item.price;

  });

  message += `Total: ₹${total}`;

  let phoneNumber = "918976515258";

  // IMPORTANT FIX
  let encodedMessage = encodeURIComponent(message);

  let whatsappURL =
  `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

  window.open(whatsappURL, "_blank");

}

  </script>

</body>
</html>
